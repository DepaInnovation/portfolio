<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Portfolio</title>
  <meta name="description" content="ไม่พบหน้าที่คุณต้องการ - 404 Page Not Found">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="image/cat-cropped.png">
  <link rel="shortcut icon" href="image/cat-cropped.png">
  <link rel="apple-touch-icon" href="image/cat-cropped.png">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-white: #ffffff;
      --text-black: #0a0a0a;
      --text-muted: #555555;
      --text-faint: #888888;
      --border-black: #0a0a0a;
      --grid-color: rgba(0, 0, 0, 0.06);
      --grid-size: 26px;
      --accent-yellow: #fef08a;

      --shadow-offset: 4px 4px 0px #0a0a0a;
      --shadow-offset-hover: 6px 6px 0px #0a0a0a;

      --font-display: 'Space Grotesk', 'IBM Plex Sans Thai', sans-serif;
      --font-body: 'Plus Jakarta Sans', 'IBM Plex Sans Thai', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-white);
      color: var(--text-black);
      font-family: var(--font-body);
      background-image:
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      padding: 24px;
      text-align: center;
    }

    .error-card {
      max-width: 540px;
      width: 100%;
      background: #ffffff;
      border: 2px solid var(--border-black);
      box-shadow: 6px 6px 0px var(--border-black);
      padding: 40px 32px;
      position: relative;
    }

    .badge-error {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 12px;
      border: 1.5px solid var(--border-black);
      background: var(--accent-yellow);
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(4.5rem, 15vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 12px;
      color: var(--text-black);
      text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.08);
    }

    .error-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 0.98rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .error-img {
      max-width: 140px;
      height: auto;
      margin: 0 auto 24px auto;
      display: block;
      filter: drop-shadow(3px 3px 0px rgba(0, 0, 0, 0.15));
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--text-black);
      color: #ffffff;
      text-decoration: none;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 13px 26px;
      border: 2px solid var(--border-black);
      box-shadow: var(--shadow-offset);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .btn-home:hover {
      background: #ffffff;
      color: var(--text-black);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-offset-hover);
    }

    .btn-home:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border-black);
    }

    .footer-note {
      margin-top: 24px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-faint);
    }
  </style>
</head>

<body>
  <div class="error-card">
    <div class="badge-error">
      <span class="badge-dot"></span>
      <span>ERROR // 404_PAGE_NOT_FOUND</span>
    </div>

    <img src="image/cat-cropped.png" alt="Lost Cat" class="error-img" onerror="this.style.display='none'">

    <div class="error-code">404</div>
    <h1 class="error-title">ดูเหมือนว่าหน้านี้จะไม่มีอยู่จริง</h1>
    <p class="error-desc">
      หน้าที่คุณกำลังตามหาอาจถูกย้าย ลบออกไปแล้ว หรือพิมพ์ URL ไม่ถูกต้องครับ
    </p>

    <a href="index.html" class="btn-home">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>กลับสู่หน้าแรก (Home)</span>
    </a>

    <div class="footer-note">PORTFOLIO // RIFHAN</div>
  </div>
</body>

</html>
